name: eddie-test
services:
  db:
    image: postgres:17.5-bookworm
    ports:
      - "5432:5432"
    environment:
      EMQX_DATABASE_PASSWORD: ${EMQX_DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    restart: "always"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/create-emqx-user.sh:/docker-entrypoint-initdb.d/create-emqx-user.sh
      - ./create-example-app-db.sql:/docker-entrypoint-initdb.d/create_database.sql
      - ./create-new-example-app-db.sql:/docker-entrypoint-initdb.d/create_new_example_app_db.sql
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}'" ]
      interval: 10s
      timeout: 3s
      retries: 3

  eddie:
    image: ghcr.io/eddie-energy/eddie:latest
    build:
      dockerfile: src/main/docker/Dockerfile
      context: ../core
    env_file:
      - .env
      - path: .env.local
        required: false
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./keys:/opt/core/keys # mount a folder to store key files
      - ./ponton:/ponton # mount a folder to store ponton files
      - ./data-needs.json:/opt/core/config/data-needs.json
    depends_on:
      - kafka
      - db

  kafka:
    # Docs: https://github.com/apache/kafka/blob/trunk/docker/examples/README.md
    image: docker.io/apache/kafka:4.1.0
    ports:
      - "9094:9094"
    environment:
      # KRaft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Big messages produced for validated historical data
      # See: https://stackoverflow.com/questions/63528508/recordtoolargeexception-in-kafka
      - KAFKA_SOCKET_RECEIVE_BUFFER_BYTES=102400
      - KAFKA_SOCKET_SEND_BUFFER_BYTES=102400
      - KAFKA_SOCKET_REQUEST_MAX_BYTES=104857600
      - KAFKA_MESSAGE_MAX_BYTES=104857600
      # Topic auto creation
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  emqx:
    image: emqx/emqx:5.8
    container_name: eddie-emqx
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083" # management web interface
    environment:
      REGION_CONNECTOR_AIIDA_MQTT_PASSWORD: ${REGION_CONNECTOR_AIIDA_MQTT_PASSWORD}
      EMQX_AUTHENTICATION__1__DATABASE: ${DATABASE_NAME}
      EMQX_AUTHENTICATION__1__SERVER: ${DATABASE_HOST}:${DATABASE_PORT}
      EMQX_AUTHENTICATION__1__PASSWORD: ${EMQX_DATABASE_PASSWORD}
      EMQX_AUTHORIZATION__SOURCES__1__DATABASE: ${DATABASE_NAME}
      EMQX_AUTHORIZATION__SOURCES__1__SERVER: ${DATABASE_HOST}:${DATABASE_PORT}
      EMQX_AUTHORIZATION__SOURCES__1__PASSWORD: ${EMQX_DATABASE_PASSWORD}
    restart: always
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/emqx.hocon:/opt/emqx/etc/base.hocon
      - ./emqx/init-user.json:/tmp/init-user.json
      - ./emqx/replace-password-with-env.sh:/tmp/replace-password-with-env.sh
    entrypoint: ["/bin/sh", "/tmp/replace-password-with-env.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    ports:
      - "8888:8080"
    profiles:
      - auth
      - example
    environment:
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_HOST}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/EDDIE-realm.json:/opt/keycloak/data/import/EDDIE-realm.json
      - ./keycloak/EXAMPLE_APP-realm.json:/opt/keycloak/data/import/EXAMPLE_APP-realm.json
      - ../keycloak-eddie-theme/themes/eddie-theme:/opt/keycloak/themes/eddie-theme

  example-app-db:
    image: timescale/timescaledb:latest-pg17
    profiles:
      - example
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: example-app
    volumes:
      - example_app_db_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-admin} -d example-app" ]
      interval: 5s
      timeout: 3s
      retries: 10

  example-app:
    # Pin the published image so updates to latest do not change this setup.
    image: ghcr.io/eddie-energy/example-app@sha256:b85e9eea971d074b280f267db6c040ee52d0cb983f471c1fd3c1cc4e5b456862
    # This release hardcodes remote Kafka defaults and does not read the
    # KAFKA_SECURITY_PROTOCOL or KAFKA_MESSAGE_FORMAT environment variables.
    command:
      - --spring.kafka.security.protocol=PLAINTEXT
      - --spring.kafka.consumer.ssl.trust-store-location=
      - --example-app.kafka.message-format=json
    profiles:
      - example
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: example-app
      POSTGRES_URL: jdbc:postgresql://example-app-db:5432/example-app
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8082}
      EXAMPLE_APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-example-app}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-example-app}
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_MESSAGE_FORMAT: json
      MQTT_SERVER_URI: tcp://eddie-emqx:1883
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-example-app-client}
      MQTT_USERNAME: ${REGION_CONNECTOR_AIIDA_MQTT_USERNAME}
      MQTT_PASSWORD: ${REGION_CONNECTOR_AIIDA_MQTT_PASSWORD}
      EDDIE_PUBLIC_URL: http://localhost:8080
      EDDIE_HISTORIC_DATANEED_ID: 9bd0668f-cc19-40a8-99db-dc2cb2802b17
      EDDIE_REALTIME_DATANEED_ID: 5dc71d7e-e8cd-4403-a3a8-d3c095c97a84
      KEYCLOAK_URL: http://localhost:8888
      KEYCLOAK_REALM: EXAMPLE_APP
      KEYCLOAK_CLIENT: ${KEYCLOAK_CLIENT:-example-app-client}
      KEYCLOAK_ISSUER_URI: http://localhost:8888/realms/EXAMPLE_APP
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/EXAMPLE_APP/protocol/openid-connect/certs
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    depends_on:
      example-app-db:
        condition: service_healthy
      eddie:
        condition: service_started
      emqx:
        condition: service_started
      keycloak:
        condition: service_started

  # Used to add security to the management port of EDDIE.
  caddy:
    image: caddy:alpine
    ports:
      - "9000:8080"
    profiles:
      - auth
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data:
  postgres_data:
  keycloak_data:
  emqx_data:
  example_app_db_data:
